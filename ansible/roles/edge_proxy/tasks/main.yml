---
# Monitoring(Bastion) 서버에 Nginx Edge Proxy 설치
# 외부 :80 → 프라이빗 노드의 Ingress NodePort(30080) 로 전달

- name: Install Nginx
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: Deploy Nginx reverse proxy config
  template:
    src: nginx-edge-proxy.conf.j2
    dest: /etc/nginx/sites-available/lunch-app
    mode: "0644"
  notify: reload nginx

- name: Enable lunch-app site
  file:
    src: /etc/nginx/sites-available/lunch-app
    dest: /etc/nginx/sites-enabled/lunch-app
    state: link
  notify: reload nginx

- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Test Nginx configuration
  command: nginx -t
  changed_when: false

- name: Ensure Nginx is running
  systemd:
    name: nginx
    state: started
    enabled: yes

- name: Display access info
  debug:
    msg: |
      ✅ Edge Proxy 설정 완료!
      🌐 외부 접속: http://{{ ansible_host }}
      📡 프록시 경로: :80 → K3s Ingress NodePort(30080)
