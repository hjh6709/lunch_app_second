---
- name: Join workers to k3s cluster
  hosts: workers
  become: true
  vars:
    master_ip: "{{ hostvars[groups['master'][0]].ansible_host | default(groups['master'][0]) }}"
  tasks:
    - name: Install common packages
      apt:
        name:
          - curl
          - ca-certificates
        state: present
        update_cache: yes

    - name: Read token from master
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      delegate_to: "{{ groups['master'][0] }}"
      register: token_file
      run_once: true

    - name: Set token fact
      set_fact:
        k3s_token: "{{ (token_file.content | b64decode).strip() }}"
      run_once: true

    - name: Install k3s agent (join)
      shell: |
        curl -sfL https://get.k3s.io | K3S_URL=https://{{ master_ip }}:6443 K3S_TOKEN={{ hostvars['localhost']['k3s_token'] | default(k3s_token) }} sh -
      args:
        creates: /usr/local/bin/k3s-agent

