---
- name: Deploy lunch app manifests to k3s
  hosts: master
  become: true
  gather_facts: false
  tasks:
    - name: Copy k8s manifests to server
      copy:
        src: ../k8s/
        dest: /home/ubuntu/k8s/
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Apply namespace
      command: kubectl apply -f /home/ubuntu/k8s/namespace.yaml
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Apply service
      command: kubectl apply -f /home/ubuntu/k8s/service.yaml
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Apply deployment
      command: kubectl apply -f /home/ubuntu/k8s/deployment.yaml
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Show resources
      shell: kubectl -n lunch get deploy,po,svc -o wide
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: out

    - debug:
        var: out.stdout_lines

